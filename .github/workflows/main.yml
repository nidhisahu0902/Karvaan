name: Build & Deploy Karvaan

on:
    push:
        branches: [main]

jobs:
    build-and-deploy:
        runs-on: self-hosted
        environment: deploy
        env:
            KUBECONFIG: /home/r16a-runner/.kube/config

        steps:
            - uses: actions/checkout@v4

            - name: Login private registry
              run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login registry.r16a.cloud -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

            - name: Build and push Docker image
              run: |
                  docker build -t registry.r16a.cloud/karvaan-music:${{ github.sha }} -t registry.r16a.cloud/karvaan-music:latest .
                  docker push registry.r16a.cloud/karvaan-music:${{ github.sha }}
                  docker push registry.r16a.cloud/karvaan-music:latest

            - name: Update deployment image in manifest
              run: |
                  sed -i "s|image: registry.r16a.cloud/karvaan-music:.*|image: registry.r16a.cloud/karvaan-music:${{ github.sha }}|" k8s/deployment.yaml

            - name: Apply Kubernetes manifests
              run: |
                  kubectl apply -f k8s/
                  kubectl rollout status deployment/karvaan-music -n karvaan-music --timeout=120s
